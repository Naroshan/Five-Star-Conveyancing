# Five Star Conveyancing — Netlify configuration
#
# This file goes at the ROOT of your Git repository — the parent folder
# containing both quote-engine/ and five-star-web/ as siblings, not inside
# either of them.
#
# `base` tells Netlify to run install/build commands from inside
# five-star-web/, but Netlify still checks out the *entire* repository
# first, so the sibling quote-engine/ folder (and the pre-built
# five-star-conveyancing-quote-engine-0.4.0.tgz inside it — see
# DEPLOYMENT.md on why that's committed rather than gitignored) is present
# and reachable via the relative "file:" path already in
# five-star-web/package.json. No custom install command needed.

[build]
  base = "five-star-web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Geo-restricts the whole site to England & Wales only — see
# five-star-web/netlify/edge-functions/geo-block.ts for the full reasoning
# (deliberately a native Netlify Edge Function reading Context.geo
# directly, not Next.js middleware/proxy, after an earlier middleware-based
# version let a real non-UK visitor through).
#
# The edge-functions default directory is resolved relative to `base`
# above, NOT the repo root (confirmed against Netlify's own docs after a
# first attempt placed the file at the repo root and Netlify silently never
# found or deployed it — no build error, no blocking, nothing) — hence
# five-star-web/netlify/edge-functions/, not a root-level netlify/ folder.
[[edge_functions]]
  path = "/*"
  function = "geo-block"

# DATABASE_URL is deliberately not set here — add it in Netlify's own
# dashboard (Site configuration → Environment variables), never commit a
# real connection string into this file or anywhere in the repo.
